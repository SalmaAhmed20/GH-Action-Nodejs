name: NodeCI
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'releases/**'
  pull_request:
    types: [opened]
    branches:
      - 'main'
    paths-ignore:
      - README.md

jobs:
  unit-test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest,macos-latest,windows-latest]
        node-version: [14.x,22.x,24.x]
        exclude:
        - os: macos-latest
          node-version: 14.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Node JS
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modulees-${{ hashFiles('package-lock.json') }}  
      - name: Install Node Dependancy  
        run: npm install
      - name: Run Unit Test
        run: npm test
      - name: Set ENV VAR on Linux and mac
        if: runner.os =='Linux' || runner.os =='macos'
        run: export PORT=4000
      - name: Set ENV VAR on  windows
        if : matrix.os =='windows-latest'
        run: Set-Variable -Name port -Value 4000
      - name: print github context
        run: echo '${{ toJSON(github) }}'

  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Node JS
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Install Node Dependancy
        run: npm install
      - name: Run code coverage
        run: npm run coverage
      - name: Upload coverage 
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: coverage

